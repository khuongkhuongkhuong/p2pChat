<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>P2P Chat</title>
        <link rel="stylesheet" href="/style.css" />
    </head>
    <body>
        <div id="auth-overlay">
            <div class="auth-box">
                <h2>💬 P2P Chat</h2>
                <div class="subtitle">Hệ thống chat phân tán có mã hoá</div>
                <div class="auth-tabs">
                    <button class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Đăng nhập</button>
                    <button class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Đăng ký</button>
                </div>

                <div id="panel-login">
                    <input
                        class="auth-input"
                        type="text"
                        id="login-username"
                        placeholder="Tên đăng nhập"
                        maxlength="30"
                    />
                    <input class="auth-input" type="password" id="login-password" placeholder="Mật khẩu" />
                    <div class="auth-error" id="login-error"></div>
                    <button class="auth-btn" id="login-btn" onclick="doLogin()">Đăng nhập</button>
                </div>

                <div id="panel-register" style="display: none">
                    <input
                        class="auth-input"
                        type="text"
                        id="reg-username"
                        placeholder="Tên đăng nhập (chữ/số/_)"
                        maxlength="30"
                    />
                    <input
                        class="auth-input"
                        type="password"
                        id="reg-password"
                        placeholder="Mật khẩu (tối thiểu 6 ký tự)"
                    />
                    <input class="auth-input" type="password" id="reg-password2" placeholder="Nhập lại mật khẩu" />
                    <div class="auth-error" id="reg-error"></div>
                    <div class="auth-success" id="reg-success"></div>
                    <button class="auth-btn" id="reg-btn" onclick="doRegister()">Tạo tài khoản</button>
                </div>

                <div class="bootstrap-info" id="bootstrap-status">🔍 Đang kiểm tra kết nối...</div>
            </div>
        </div>

        <div id="group-modal">
            <div class="modal-box">
                <h3>Tạo nhóm chat</h3>
                <input type="text" id="group-name-input" placeholder="Tên nhóm..." />
                <div id="peer-checkboxes"></div>
                <div class="modal-actions">
                    <button class="btn-cancel" onclick="closeGroupModal()">Hủy</button>
                    <button class="btn-create" onclick="createGroup()">Tạo nhóm</button>
                </div>
            </div>
        </div>

        <div id="sidebar">
            <div id="my-info">
                <span id="my-info-text">Đang kết nối...</span>
                <button id="logout-btn" onclick="doLogout()">Đăng xuất</button>
            </div>
            <div id="sidebar-tabs">
                <button class="tab-btn active" onclick="switchTab('peers')">Liên hệ</button>
                <button class="tab-btn" onclick="switchTab('groups')">Nhóm</button>
            </div>
            <div id="peer-list"></div>
            <div id="group-list" style="display: none">
                <button id="new-group-btn" onclick="openGroupModal()">+ Tạo nhóm mới</button>
                <div id="group-items"></div>
            </div>
        </div>

        <div id="chat">
            <div id="empty-state">
                <div class="big-icon">💬</div>
                <div>Chọn một liên hệ hoặc nhóm để bắt đầu chat</div>
            </div>
            <div id="chat-main" style="display: none">
                <div id="chat-header">
                    <div class="header-avatar" id="header-avatar">?</div>
                    <div>
                        <div id="chat-header-name">-</div>
                        <div id="chat-header-sub">-</div>
                    </div>
                    <div id="encryption-badge">🔒 AES Encrypted</div>
                </div>
                <div id="msgs"></div>
                <div id="input-area">
                    <input type="file" id="file-input" onchange="sendFile()" />
                    <button id="file-btn" onclick="document.getElementById('file-input').click()">📎</button>
                    <input type="text" id="msgInput" placeholder="Nhập tin nhắn..." />
                    <button id="send-btn" onclick="send()">Gửi</button>
                </div>
            </div>
        </div>

        <script>
            let myName = "";
            let myAddr = "";
            let myPort = 0;
            let currentTarget = null;
            let peers = [];
            let groups = [];
            let chatStorage = {};
            let unread = new Set();
            let refreshTimer = null;

            window.addEventListener("load", async () => {
                try {
                    const host = await (await fetch("/api/bootstrap-host")).text();
                    document.getElementById("bootstrap-status").textContent =
                        host === "localhost" ? "🟢 Bootstrap: máy này" : "🟢 Bootstrap: " + host;
                } catch (e) {
                    document.getElementById("bootstrap-status").textContent = "🔴 Không kết nối được Bootstrap";
                }

                try {
                    const infoRes = await fetch("/api/info");

                    if (!infoRes.ok) {
                        localStorage.removeItem("p2p_current_user");
                        return;
                    }

                    const info = await infoRes.json();

                    myName = info.name;
                    myAddr = info.addr;
                    myPort = info.port;

                    document.getElementById("auth-overlay").style.display = "none";

                    currentTarget = null;
                    peers = [];
                    groups = [];
                    chatStorage = {};
                    unread = new Set();

                    await loadAllHistory();
                    await loadGroups();

                    if (refreshTimer) clearInterval(refreshTimer);
                    refreshTimer = setInterval(refresh, 500);

                    await refresh();
                } catch (e) {
                    localStorage.removeItem("p2p_current_user");
                }
            });

            function switchAuthTab(tab) {
                document.getElementById("panel-login").style.display = tab === "login" ? "" : "none";
                document.getElementById("panel-register").style.display = tab === "register" ? "" : "none";
                document.getElementById("tab-login").classList.toggle("active", tab === "login");
                document.getElementById("tab-register").classList.toggle("active", tab === "register");
                ["login-error", "reg-error", "reg-success"].forEach(
                    (id) => (document.getElementById(id).textContent = ""),
                );
            }

            async function doRegister() {
                const username = document.getElementById("reg-username").value.trim();
                const password = document.getElementById("reg-password").value;
                const password2 = document.getElementById("reg-password2").value;
                const errEl = document.getElementById("reg-error");
                const okEl = document.getElementById("reg-success");

                errEl.textContent = "";
                okEl.textContent = "";

                if (!username || !password) return (errEl.textContent = "Vui lòng nhập đủ thông tin");
                if (!/^[a-zA-Z0-9_]+$/.test(username)) return (errEl.textContent = "Tên chỉ dùng chữ, số và dấu _");
                if (password.length < 6) return (errEl.textContent = "Mật khẩu tối thiểu 6 ký tự");
                if (password !== password2) return (errEl.textContent = "Mật khẩu nhập lại không khớp");

                const btn = document.getElementById("reg-btn");
                btn.disabled = true;
                btn.textContent = "Đang tạo...";

                try {
                    const res = await fetch(
                        `/api/register?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`,
                        { method: "POST" },
                    );

                    if (res.ok) {
                        okEl.textContent = "✅ Tạo tài khoản thành công! Đang chuyển sang đăng nhập...";
                        ["reg-username", "reg-password", "reg-password2"].forEach(
                            (id) => (document.getElementById(id).value = ""),
                        );
                        setTimeout(() => switchAuthTab("login"), 1500);
                    } else {
                        errEl.textContent = "❌ " + (await res.text());
                    }
                } catch (e) {
                    errEl.textContent = "❌ Không kết nối được server";
                }

                btn.disabled = false;
                btn.textContent = "Tạo tài khoản";
            }

            async function doLogin() {
                const username = document.getElementById("login-username").value.trim();
                const password = document.getElementById("login-password").value;
                const errEl = document.getElementById("login-error");

                errEl.textContent = "";

                if (!username || !password) return (errEl.textContent = "Vui lòng nhập đủ thông tin");

                const btn = document.getElementById("login-btn");
                btn.disabled = true;
                btn.textContent = "Đang đăng nhập...";

                try {
                    const loginRes = await fetch(
                        `/api/login?name=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}`,
                        {
                            method: "POST",
                        },
                    );

                    if (!loginRes.ok) {
                        errEl.textContent = "❌ " + (await loginRes.text());
                        return;
                    }

                    myName = username;
                    document.getElementById("auth-overlay").style.display = "none";

                    currentTarget = null;
                    peers = [];
                    groups = [];
                    chatStorage = {};
                    unread = new Set();

                    document.getElementById("msgs").innerHTML = "";
                    document.getElementById("peer-list").innerHTML = "";
                    document.getElementById("group-items").innerHTML = "";
                    document.getElementById("empty-state").style.display = "flex";
                    document.getElementById("chat-main").style.display = "none";

                    await loadAllHistory();
                    await loadGroups();

                    renderPeerList();
                    renderMessages();

                    if (refreshTimer) clearInterval(refreshTimer);
                    refreshTimer = setInterval(refresh, 500);
                    await refresh();
                } catch (e) {
                    errEl.textContent = "❌ Không kết nối được server";
                }

                btn.disabled = false;
                btn.textContent = "Đăng nhập";
            }

            async function doLogout() {
                await fetch("/api/logout", { method: "POST" });

                if (refreshTimer) clearInterval(refreshTimer);
                localStorage.removeItem("p2p_current_user");
                myName = "";
                myAddr = "";
                myPort = 0;
                currentTarget = null;
                peers = [];
                groups = [];
                chatStorage = {};
                unread = new Set();

                document.getElementById("auth-overlay").style.display = "flex";
                document.getElementById("login-username").value = "";
                document.getElementById("login-password").value = "";
                document.getElementById("login-error").textContent = "";
                document.getElementById("my-info-text").textContent = "Đang kết nối...";
                document.getElementById("msgs").innerHTML = "";
                document.getElementById("peer-list").innerHTML = "";
                document.getElementById("group-items").innerHTML = "";
                document.getElementById("empty-state").style.display = "flex";
                document.getElementById("chat-main").style.display = "none";

                switchAuthTab("login");
            }

            async function loadAllHistory() {
                chatStorage = {};

                try {
                    const keys = await (await fetch("/api/conversations")).json();

                    for (const key of keys) {
                        const lines = await (await fetch(`/api/history?key=${encodeURIComponent(key)}`)).json();

                        if (lines && lines.length > 0) {
                            chatStorage[key] = lines.map((line) => parseHistoryLine(line));
                        }
                    }
                } catch (e) {
                    console.error("Lỗi load lịch sử:", e);
                }
            }

            async function loadGroups() {
                try {
                    const res = await fetch("/api/groups");
                    groups = await res.json();
                } catch (e) {
                    groups = [];
                    console.error("Lỗi load groups:", e);
                }
            }

            async function loadGroupMembers(groupId) {
                try {
                    const res = await fetch(`/api/group-members?groupId=${encodeURIComponent(groupId)}`);
                    return await res.json();
                } catch (e) {
                    console.error("Lỗi load group members:", e);
                    return [];
                }
            }

            function parseHistoryLine(line) {
                if (line.startsWith("ME|")) return { raw: line, mine: true, txt: line.substring(3) };
                if (line.startsWith("THEM|")) return { raw: line, mine: false, txt: line.substring(5) };
                if (line.startsWith("Tôi:")) return { raw: line, mine: true, txt: line.substring(5).trim() };
                return { raw: line, mine: false, txt: line };
            }

            async function refresh() {
                try {
                    const info = await (await fetch("/api/info")).json();

                    myPort = info.port;
                    myName = info.name;
                    myAddr = info.addr || info.ip + ":" + info.port;

                    document.getElementById("my-info-text").textContent = `👤 ${info.name}  •  ${myAddr}`;

                    peers = await (await fetch("/api/peers")).json();
                    await loadGroups();

                    renderPeerList();

                    const msgs = await (await fetch("/api/messages")).json();

                    for (const msg of msgs) {
                        await handleIncoming(msg);
                    }
                } catch (e) {}
            }

            async function handleIncoming(raw) {
                if (raw.startsWith("[Private]|")) {
                    const parts = raw.split("|");
                    const senderInfo = parts[1];
                    const dash = senderInfo.lastIndexOf("-");
                    const senderName = senderInfo.substring(0, dash);
                    const senderAddr = senderInfo.substring(dash + 1);
                    const content = parts.slice(2).join("|");
                    const histKey = "peer:" + senderName;

                    pushMsg(histKey, {
                        raw: "THEM|" + content,
                        _addr: senderAddr,
                        _name: senderName,
                    });

                    if (!currentTarget || currentTarget.histKey !== histKey) unread.add(histKey);
                } else if (raw.startsWith("[Group]|")) {
                    const parts = raw.split("|");
                    const groupId = parts[1];
                    const senderName = parts[2].split("-")[0];
                    const content = parts.slice(3).join("|");
                    const histKey = "group:" + groupId;

                    pushMsg(histKey, {
                        raw: "THEM|" + senderName + ": " + content,
                    });

                    if (!currentTarget || currentTarget.histKey !== histKey) unread.add(histKey);
                } else if (raw.startsWith("[Broadcast]|")) {
                    pushMsg("broadcast", {
                        raw: "THEM|📢 " + raw.split("|").slice(1).join("|"),
                    });
                } else if (raw.startsWith("[GROUP_INVITE]|")) {
                    const parts = raw.split("|");
                    const groupName = parts[2];
                    const creator = parts[4].split("-")[0];

                    await loadGroups();
                    renderPeerList();
                    showToast(`${creator} đã thêm bạn vào nhóm "${groupName}"`);
                } else if (raw.startsWith("[GROUP_DELETE]|")) {
                    const parts = raw.split("|");
                    const groupId = parts[1];
                    const groupName = parts[2];
                    const creator = parts[3].split("-")[0];

                    groups = groups.filter((g) => g.id !== groupId);

                    if (currentTarget && currentTarget.groupId === groupId) {
                        currentTarget = null;
                        document.getElementById("empty-state").style.display = "flex";
                        document.getElementById("chat-main").style.display = "none";
                    }

                    renderPeerList();
                    showToast(`${creator} đã giải tán nhóm "${groupName}"`, "#ff4d4d");
                } else if (raw.startsWith("[FILE_RECEIVED]|")) {
                    const parts = raw.split("|");
                    const senderAddr = parts[1];
                    const senderName = parts[2];
                    const fileName = parts[3];
                    const fileId = parts[4];
                    const histKey = "peer:" + senderName;

                    pushMsg(histKey, {
                        raw: "THEM|FILE",
                        type: "file-in",
                        fileId,
                        fileName,
                        _addr: senderAddr,
                        _name: senderName,
                    });

                    if (!currentTarget || currentTarget.histKey !== histKey) unread.add(histKey);
                } else if (raw.startsWith("[PENDING_NOTICE]|")) {
                    const count = raw.split("|")[1] || "0";
                    showToast(`📦 Bạn vừa nhận ${count} tin nhắn chờ`, "#28a745");
                }

                renderMessages();
                renderPeerList();
            }

            function pushMsg(key, msg) {
                if (!chatStorage[key]) chatStorage[key] = [];

                if (!msg.txt && msg.raw) {
                    if (msg.raw.startsWith("ME|")) {
                        msg.mine = true;
                        msg.txt = msg.raw.substring(3);
                    } else if (msg.raw.startsWith("THEM|")) {
                        msg.mine = false;
                        msg.txt = msg.raw.substring(5);
                    }
                }

                chatStorage[key].push(msg);
            }

            function renderPeerList() {
                const list = document.getElementById("peer-list");
                let html = "";

                (peers || []).forEach((p) => {
                    if (!p.includes("-")) return;

                    const dash = p.lastIndexOf("-");
                    const name = p.substring(0, dash);
                    const addr = p.substring(dash + 1);

                    if (name === myName) return;

                    const histKey = "peer:" + name;
                    const isActive = currentTarget && currentTarget.histKey === histKey;
                    const hasUnread = unread.has(histKey);
                    const isOffline = addr === "OFFLINE";

                    html += `
            <div class="peer-item ${isActive ? "active" : ""} ${isOffline ? "offline" : ""}"
                 onclick="selectPeer('${addr}','${name}','${histKey}')">
              <div class="peer-avatar ${isOffline ? "offline-avatar" : ""}">
                ${name[0].toUpperCase()}
              </div>
              <div>
                <div class="peer-name">${name}</div>
                <div class="peer-sub">
                  ${isOffline ? "Offline • có thể gửi tin chờ" : addr}
                </div>
              </div>
              ${hasUnread ? '<div class="unread-dot"></div>' : ""}
            </div>
          `;
                });

                list.innerHTML =
                    html ||
                    '<div style="padding:20px;color:#aaa;text-align:center;font-size:13px">Chưa có peer online</div>';

                const groupItems = document.getElementById("group-items");
                let ghtml = "";

                groups.forEach((g) => {
                    const histKey = "group:" + g.id;
                    const isActive = currentTarget && currentTarget.histKey === histKey;
                    const hasUnread = unread.has(histKey);
                    const isOwner = g.owner === myName;

                    ghtml += `
            <div class="peer-item ${isActive ? "active" : ""}"
                 onclick="selectGroup('${g.id}','${g.name}','${histKey}')">
              <div class="peer-avatar purple">${g.name[0].toUpperCase()}</div>
              <div style="flex:1">
                <div class="peer-name">${g.name}</div>
                <div class="peer-sub">${isOwner ? "👑 Chủ nhóm" : "Thành viên"}</div>
              </div>
              ${hasUnread ? '<div class="unread-dot"></div>' : ""}
              ${
                  isOwner
                      ? `<button onclick="event.stopPropagation();deleteGroup('${g.id}','${g.name}')"
                       class="del-group-btn" title="Xóa nhóm">✕</button>`
                      : ""
              }
            </div>
          `;
                });

                groupItems.innerHTML =
                    ghtml || '<div style="padding:20px;color:#aaa;text-align:center;font-size:13px">Chưa có nhóm</div>';
            }

            function selectPeer(addr, name, histKey) {
                currentTarget = { type: "peer", addr, name, histKey };
                unread.delete(histKey);
                showChatArea(name, addr, name[0].toUpperCase(), "#0084ff");
                renderMessages();
                renderPeerList();
            }

            async function selectGroup(groupId, name, histKey) {
                const g = groups.find((x) => x.id === groupId);
                const members = await loadGroupMembers(groupId);

                currentTarget = {
                    type: "group",
                    groupId,
                    name,
                    members,
                    histKey,
                };

                unread.delete(histKey);

                showChatArea(
                    name,
                    `${members.length} thành viên${g && g.owner === myName ? " • Bạn là chủ nhóm" : ""}`,
                    name[0].toUpperCase(),
                    "#7b2ff7",
                );

                renderMessages();
                renderPeerList();
            }

            function showChatArea(title, sub, avatarChar, color) {
                document.getElementById("empty-state").style.display = "none";

                const cm = document.getElementById("chat-main");
                cm.style.display = "flex";
                cm.style.flexDirection = "column";

                document.getElementById("chat-header-name").textContent = title;
                document.getElementById("chat-header-sub").textContent =
                    sub === "OFFLINE" ? "Offline • người có thể gửi tin chờ" : sub;

                const av = document.getElementById("header-avatar");
                av.textContent = avatarChar;
                av.style.background = color;
            }

            function renderMessages() {
                if (!currentTarget) return;

                const msgs = chatStorage[currentTarget.histKey] || [];
                const div = document.getElementById("msgs");

                div.innerHTML = msgs
                    .map((m) => {
                        if (m.type === "error") return `<div class="error-bubble">${m.txt}</div>`;
                        if (m.type === "stored") return `<div class="stored-bubble">${m.txt}</div>`;
                        if (m.type === "system") return `<div class="system-msg">${m.txt}</div>`;

                        if (m.type === "file-in") {
                            return `
                <div class="bubble theirs file-bubble">
                  <span class="file-icon">📎</span>
                  <div>
                    <div style="font-size:13px;margin-bottom:6px">
                      ${m._name || ""} gửi file: ${m.fileName}
                    </div>
                    <a href="/api/download?fileId=${m.fileId}"
                       download="${m.fileName}"
                       class="download-btn">⬇ Tải xuống</a>
                  </div>
                </div>
              `;
                        }

                        if (m.type === "file") {
                            return `<div class="bubble mine file-bubble"><span class="file-icon">📎</span>${m.txt}</div>`;
                        }

                        return `<div class="bubble ${m.mine ? "mine" : "theirs"}">${m.txt}</div>`;
                    })
                    .join("");

                div.scrollTop = div.scrollHeight;
            }

            async function send() {
                const input = document.getElementById("msgInput");
                const val = input.value.trim();

                if (!val || !currentTarget) return;

                input.value = "";

                const histKey = currentTarget.histKey;

                if (currentTarget.type === "peer") {
                    const latest = (peers || []).find((p) => {
                        if (!p.includes("-")) return false;
                        const dash = p.lastIndexOf("-");
                        const name = p.substring(0, dash);
                        return name === currentTarget.name;
                    });

                    if (latest) {
                        const dash = latest.lastIndexOf("-");
                        currentTarget.addr = latest.substring(dash + 1);
                    }
                }

                pushMsg(histKey, { raw: "ME|" + val, mine: true, txt: val });
                renderMessages();

                if (currentTarget.type === "peer") {
                    const res = await fetch(
                        `/api/send?target=${encodeURIComponent(currentTarget.addr)}&targetName=${encodeURIComponent(currentTarget.name)}&msg=${encodeURIComponent(val)}`,
                        { method: "POST" },
                    );

                    if (!res.ok) {
                        const txt = await res.text();

                        pushMsg(
                            histKey,
                            txt === "STORED"
                                ? {
                                      raw: "SYS|stored",
                                      type: "stored",
                                      txt: "📦 Peer offline — tin đã lưu, sẽ giao khi họ online lại.",
                                  }
                                : {
                                      raw: "SYS|error",
                                      type: "error",
                                      txt: "⚠️ Gửi thất bại.",
                                  },
                        );

                        renderMessages();
                    }
                } else if (currentTarget.type === "group") {
                    const members = await loadGroupMembers(currentTarget.groupId);
                    currentTarget.members = members;

                    const res = await fetch(
                        `/api/sendgroup?groupId=${encodeURIComponent(currentTarget.groupId)}&msg=${encodeURIComponent(val)}`,
                        { method: "POST" },
                    );

                    if (!res.ok) {
                        pushMsg(histKey, {
                            raw: "SYS|error",
                            type: "error",
                            txt: "⚠️ Gửi tin nhắn nhóm thất bại.",
                        });
                        renderMessages();
                    }
                }
            }

            async function sendFile() {
                const fileInput = document.getElementById("file-input");

                if (!fileInput.files[0]) return;

                if (!currentTarget || currentTarget.type !== "peer") {
                    alert("Chỉ gửi file trong chat riêng!");
                    fileInput.value = "";
                    return;
                }

                const file = fileInput.files[0];
                const histKey = currentTarget.histKey;

                pushMsg(histKey, {
                    txt: "📎 Đang gửi: " + file.name + "...",
                    mine: true,
                    type: "system",
                });

                renderMessages();

                const fd = new FormData();
                fd.append("file", file);

                try {
                    const res = await fetch(`/api/sendfile?target=${encodeURIComponent(currentTarget.addr)}`, {
                        method: "POST",
                        body: fd,
                    });

                    const msgs = chatStorage[histKey];
                    if (msgs && msgs.length > 0) msgs.pop();

                    pushMsg(
                        histKey,
                        res.ok
                            ? {
                                  txt: "📎 Đã gửi file: " + file.name,
                                  mine: true,
                                  type: "file",
                              }
                            : {
                                  txt: "⚠️ Gửi file thất bại.",
                                  type: "error",
                              },
                    );
                } catch (e) {
                    pushMsg(histKey, {
                        txt: "⚠️ Lỗi kết nối khi gửi file.",
                        type: "error",
                    });
                }

                fileInput.value = "";
                renderMessages();
            }

            function switchTab(tab) {
                document
                    .querySelectorAll(".tab-btn")
                    .forEach((b, i) =>
                        b.classList.toggle("active", (tab === "peers" && i === 0) || (tab === "groups" && i === 1)),
                    );

                document.getElementById("peer-list").style.display = tab === "peers" ? "" : "none";
                document.getElementById("group-list").style.display = tab === "groups" ? "" : "none";
            }

            function openGroupModal() {
                const checkboxes = document.getElementById("peer-checkboxes");

                checkboxes.innerHTML =
                    (peers || [])
                        .filter((p) => {
                            if (!p.includes("-")) return false;

                            const dash = p.lastIndexOf("-");
                            const name = p.substring(0, dash);
                            const addr = p.substring(dash + 1);

                            return name !== myName && addr !== "OFFLINE";
                        })
                        .map((p) => {
                            const dash = p.lastIndexOf("-");
                            const name = p.substring(0, dash);
                            const addr = p.substring(dash + 1);

                            return `
                <label class="check-peer">
                  <input type="checkbox" value="${name}" data-addr="${addr}" />
                  ${name}
                  <span style="color:#aaa;font-size:11px">${addr}</span>
                </label>
              `;
                        })
                        .join("") || '<div style="color:#aaa;font-size:13px">Không có peer online</div>';

                document.getElementById("group-modal").classList.add("show");
            }

            function closeGroupModal() {
                document.getElementById("group-modal").classList.remove("show");
            }

            async function createGroup() {
                const name = document.getElementById("group-name-input").value.trim();

                if (!name) return alert("Nhập tên nhóm!");

                const checked = [...document.querySelectorAll("#peer-checkboxes input:checked")];

                if (checked.length === 0) return alert("Chọn ít nhất 1 người!");

                const members = checked.map((c) => c.value);

                const groupId = Date.now().toString();

                await fetch(
                    `/api/creategroup?groupId=${encodeURIComponent(groupId)}&groupName=${encodeURIComponent(name)}&members=${encodeURIComponent(members.join(","))}`,
                    { method: "POST" },
                );

                closeGroupModal();
                document.getElementById("group-name-input").value = "";

                await loadGroups();
                renderPeerList();
                await selectGroup(groupId, name, "group:" + groupId);
            }

            async function deleteGroup(groupId, groupName) {
                if (!confirm(`Xóa nhóm "${groupName}"?\nTất cả thành viên sẽ bị xóa khỏi nhóm.`)) return;

                const members = await loadGroupMembers(groupId);

                await fetch(
                    `/api/deletegroup?groupId=${encodeURIComponent(groupId)}&groupName=${encodeURIComponent(groupName)}&members=${encodeURIComponent(members.join(","))}`,
                    { method: "POST" },
                );

                groups = groups.filter((x) => x.id !== groupId);

                if (currentTarget && currentTarget.groupId === groupId) {
                    currentTarget = null;
                    document.getElementById("empty-state").style.display = "flex";
                    document.getElementById("chat-main").style.display = "none";
                }

                renderPeerList();
            }

            function showToast(msg, bg = "#0084ff") {
                const el = document.createElement("div");

                el.style.cssText =
                    `position:fixed;bottom:20px;right:20px;background:${bg};color:#fff;` +
                    "padding:12px 20px;border-radius:10px;font-size:14px;z-index:9999;" +
                    "box-shadow:0 4px 12px rgba(0,0,0,.2)";

                el.textContent = msg;
                document.body.appendChild(el);

                setTimeout(() => el.remove(), 4000);
            }

            document.addEventListener("keypress", (e) => {
                if (e.key !== "Enter") return;

                const overlay = document.getElementById("auth-overlay");

                if (overlay && overlay.style.display !== "none") {
                    document.getElementById("tab-login").classList.contains("active") ? doLogin() : doRegister();
                } else {
                    send();
                }
            });
        </script>
    </body>
</html>
